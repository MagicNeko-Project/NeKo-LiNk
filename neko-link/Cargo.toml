[package]
name = "neko-link"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.3", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
pnet = "0.34"
aya = { version = "0.12", features = ["async_tokio"] }
aya-log = "0.2"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
nix = { version = "0.26", features = ["socket", "ioctl", "net", "sched"] }
rand = "0.8"
neko-link-common = { path = "../neko-link-common", features = ["user"] }
