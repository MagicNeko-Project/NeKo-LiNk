[package]
name = "neko-link-ebpf"
version = "0.1.0"
edition = "2021"

[dependencies]
aya-ebpf = "0.1.0"
aya-log-ebpf = "0.1.0"
neko-link-common = { path = "../neko-link-common", features = ["ebpf"] }
network-types = "0.0.5"

[[bin]]
name = "neko-link"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
debug = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
