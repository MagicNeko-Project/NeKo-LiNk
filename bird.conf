# /etc/bird/bird.conf

# ------------------------------------------------
# 1. 全局设置
# ------------------------------------------------
log syslog all;
router id 172.30.5.157;  # 对应 FRR 的 router-id

# ------------------------------------------------
# 2. 核心协议 (Device & Kernel)
# ------------------------------------------------
protocol device {
    scan time 10;
}

# IPv4 内核协议
protocol kernel kernel4 {
    ipv4 {
        import none;  # 不从系统路由表学路由 (防止环路)

        # 【关键逻辑】：写入内核时的过滤器
        export filter {
            # 如果是那个特定的静态协议，不要写入内核(本机走默认路由)
            if proto = "my_hidden_routes" then reject;

            # 其他的(比如 OSPF 学到的路由)写入内核
            accept;
        };
    };
}

# IPv6 内核协议
protocol kernel kernel6 {
    ipv6 {
        import none;
        export all;   # IPv6 暂时全部写入内核
    };
}
# ------------------------------------------------
# 3. 静态路由定义 (只用于通告)
# ------------------------------------------------
protocol static my_hidden_routes {
    ipv4;
    # 对应 FRR: ip route 1.1.1.1/32 172.30.5.1
    # 这条路由存在于 BIRD 内存中，但被上面的 kernel4 拒绝写入系统
    route 1.1.1.1/32 via 172.30.5.1;
}

protocol static my_hidden_routes2 {
    ipv6;
    # 黑洞路由 (Blackhole)：数据包会被静默丢弃，
    # 常用于防止在动态路由同步前产生环路，或者单纯为了把汇总段通告出去喵。
    route 2000::/3 blackhole;
}

# ------------------------------------------------
# 4. OSPFv2 (IPv4)
# ------------------------------------------------
protocol ospf v2 ospf4 {
        ipv4 {
        import all;

        # 【关键逻辑】：只将静态路由通告给邻居
        # 对应 FRR: redistribute static
        export where proto = "my_hidden_routes";
    };

    area 0.0.0.0 {
        interface "to-nvt-alibj" {
            # 默认参数
        };
        interface "to-wvt-singbox" {
        };
    };
}

# ------------------------------------------------
# 5. OSPFv3 (IPv6)
# ------------------------------------------------
protocol ospf v3 ospf6 {
    ipv6 {
        import all;
        export none; # FRR 原配置中没有 redistribute static，所以这里不导出
    };

    area 0.0.0.0 {
        interface "to-nvt-alibj";
    };
}

# ------------------------------------------------
# 6. iBGP 协议 (拆分为 v4/v6 独立会话以绕过 ROS Bug 喵)
# ------------------------------------------------

# IPv4 独立会话
protocol bgp bgp_catio_v4 {
    local as 137256;
    neighbor 100.64.32.1 as 137256; 
    direct;
    interface "to-wvt-catio";

    ipv4 {
        next hop self;
        import all;
        export filter {
            if proto = "ospf4" then accept;
            reject;
        };
    };
}

# IPv6 独立会话
protocol bgp bgp_catio_v6 {
    local as 137256;
    # 使用对端的 IPv6 Link-Local 地址喵
    neighbor fe80::bfa9:2fa8:4376:28f4 as 137256; 
    direct;
    interface "to-wvt-catio";

    ipv6 {
        next hop self;
        import all;
        export filter {
            if proto = "ospf6" then accept;
            reject;
        };
    };
}
