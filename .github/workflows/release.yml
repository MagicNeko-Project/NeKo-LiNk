name: Release NekoLink ฅ^•ﻌ•^ฅ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target-env }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target-env: [ubuntu-22.04, ubuntu-24.04, debian-12, debian-13]
        arch: [amd64, arm64]
    
    container:
      # 修复镜像名称格式：ubuntu-xx.xx -> ubuntu:xx.xx
      image: ${{ (contains(matrix.target-env, 'ubuntu') && replace(matrix.target-env, 'ubuntu-', 'ubuntu:')) || (matrix.target-env == 'debian-12' && 'debian:12') || 'debian:trixie' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y curl build-essential libcap-dev pkg-config git wget

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build NekoLink
        run: |
          . $HOME/.cargo/env
          cargo build --release

      - name: Package .deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
          # 重命名以便区分环境
          VERSION=$(cat VERSION)
          ARCH=$(dpkg --print-architecture)
          MV_NAME="NekoLink_${VERSION}_${{ matrix.target-env }}_${ARCH}.deb"
          mv NekoLink_${VERSION}_${ARCH}.deb $MV_NAME
          echo "PKG_PATH=$MV_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target-env }}-${{ matrix.arch }}
          path: ${{ env.PKG_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: package-*
          merge-multiple: true

      - name: Extract Changelog
        id: changelog
        run: |
          VERSION=$(cat VERSION)
          # 提取对应版本的日志内容（找到第一个匹配的 ## [VERSION] 到下一个 ## 之间的内容）
          # 考虑到主人可能是在推送 tag 时触发，VERSION 可能与 Tag 一致
          sed -n "/## \[$VERSION\]/,/## /p" CHANGELOG.md | sed '$d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No notes found for version $VERSION, using raw changelog header."
            head -n 20 CHANGELOG.md > release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*.deb
          body_path: release_notes.md
          prerelease: true
          draft: false
          name: NekoLink v${{ github.ref_name }}
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
